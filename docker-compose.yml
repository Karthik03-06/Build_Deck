version: '3.8'

networks:
  builddeck-network:
    name: builddeck-network
    driver: bridge

volumes:
  builddeck-mysql-data:
    name: builddeck-mysql-data

services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: builddeck-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: builddeck
      MYSQL_USER: builddeck
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - builddeck-mysql-data:/var/lib/mysql
    networks:
      - builddeck-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # Traefik Reverse Proxy with Dynamic Docker Provider
  # ============================================================================
  traefik:
    image: traefik:v2.10
    container_name: builddeck-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=builddeck-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"        # Traefik Preview Router
      - "8080:8080"    # Traefik Web UI Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - builddeck-network
    depends_on:
      - mysql

  # ============================================================================
  # BuildDeck Backend API & Socket Server
  # ============================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: builddeck-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: mysql://root:password@mysql:3306/builddeck
      FRONTEND_URL: http://localhost:5173
      TRAEFIK_HOST: traefik
      PREVIEW_DOMAIN: preview.localhost
      SESSION_SECRET: super_secret_builddeck_session_key_987654321
      GITHUB_WEBHOOK_SECRET: builddeck_webhook_secret_key_12345
    volumes:
      - ./server:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - builddeck-network
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # BuildDeck React Client Dashboard
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: builddeck-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_SOCKET_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - builddeck-network
    depends_on:
      - backend
